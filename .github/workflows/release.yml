name: release

on:
  workflow_dispatch: {}

jobs:
  release:
    runs-on: windows-latest

    permissions:
      contents: write

    steps:
    - uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 9.0.x

    - name: Read version from CircleFlow.csproj
      id: version
      shell: pwsh
      run: |
        $version = ([xml](Get-Content CircleFlow.csproj)).Project.PropertyGroup.Version | Where-Object { $_ } | Select-Object -First 1
        if (-not $version) { throw 'Version is missing in CircleFlow.csproj.' }
        git fetch --tags --quiet
        # A release for an unchanged version would overwrite the previous one.
        if (git tag --list "v$version") { throw "Tag v$version already exists. Bump <Version> in CircleFlow.csproj first." }
        "version=$version" >> $env:GITHUB_OUTPUT

    - name: Build release
      shell: pwsh
      run: ./build_release.ps1 -NoPause

    - name: Publish release
      uses: softprops/action-gh-release@v2
      with:
        files: bin/releases/CircleFlow-${{ steps.version.outputs.version }}-win-x64.zip
        tag_name: v${{ steps.version.outputs.version }}
        target_commitish: ${{ github.sha }}
        fail_on_unmatched_files: true
