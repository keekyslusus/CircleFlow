name: release

on:
  workflow_dispatch: {}

jobs:
  release:
    runs-on: windows-latest

    permissions:
      contents: write

    steps:
    - uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 9.0.x

    - name: Read version from CircleFlow.csproj
      id: version
      shell: pwsh
      run: |
        $version = ([xml](Get-Content CircleFlow.csproj)).Project.PropertyGroup.Version | Where-Object { $_ } | Select-Object -First 1
        if (-not $version) { throw 'Version is missing in CircleFlow.csproj.' }
        git fetch --tags --quiet
        # A release for an unchanged version would overwrite the previous one.
        if (git tag --list "v$version") { throw "Tag v$version already exists. Bump <Version> in CircleFlow.csproj first." }
        "version=$version" >> $env:GITHUB_OUTPUT

    - name: Download previous release for delta updates
      shell: pwsh
      run: |
        dotnet tool restore
        dotnet vpk download github --repoUrl https://github.com/${{ github.repository }} --token ${{ secrets.GITHUB_TOKEN }} -o bin/releases
        # The first Velopack release has no previous feed; it ships without a delta package.
        if ($LASTEXITCODE -ne 0) { Write-Host 'No previous Velopack release found.' }
        exit 0

    - name: Build release
      shell: pwsh
      run: ./build_release.ps1 -NoPause

    - name: Publish release
      shell: pwsh
      run: >
        dotnet vpk upload github --repoUrl https://github.com/${{ github.repository }} --token ${{ secrets.GITHUB_TOKEN }}
        -o bin/releases --publish --releaseName "CircleFlow ${{ steps.version.outputs.version }}"
        --tag v${{ steps.version.outputs.version }} --targetCommitish ${{ github.sha }}
